name: PR checks

# Every PR must close its ticket on merge. "edited" re-runs the check when the description
# or the base branch changes.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  linked-issue:
    # Dependabot PRs have no ticket.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: PR closes a ticket on merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # Passed via env, not inlined, so the PR text can never run as shell code.
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "$BASE" != "$DEFAULT_BRANCH" ]; then
            # GitHub only links closing issues for PRs into the default branch, so a stacked PR
            # is checked by keyword until it is retargeted (retargeting re-runs this check).
            if printf '%s' "$BODY" | grep -qiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+(([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)?#|https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/issues/)[0-9]+'; then
              echo "::notice::Stacked PR (base: $BASE): closing keyword found. GitHub links it once the PR targets $DEFAULT_BRANCH."
              exit 0
            fi
            echo "::error::Add 'Closes #<issue>' to the PR description so the ticket closes on merge."
            exit 1
          fi
          # Ask GitHub which issues this PR closes. It links them a few seconds after the
          # description is saved, so retry briefly before failing.
          for attempt in 1 2 3 4 5 6; do
            count=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json closingIssuesReferences -q '.closingIssuesReferences | length')
            if [ "$count" -gt 0 ]; then
              echo "Closes $count issue(s) on merge."
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then sleep 5; fi
          done
          echo "::error::This PR closes no issue on merge. Add 'Closes #<issue>' (an existing issue) to the description."
          exit 1
