[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-practice-app"
version = "0.1.0"
description = "Streamlit interview practice coach powered by OpenRouter LLMs"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openai==3.22.1",
    "streamlit==1.64.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
